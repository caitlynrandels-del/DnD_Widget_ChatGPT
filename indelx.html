<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Emberfall — D&D</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#090c11;color:#e9edf2;font:14px system-ui;overflow:hidden}button,input,select{font:inherit}.app{height:100dvh;display:grid;grid-template-rows:55px 1fr 92px}.top{padding:0 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #29313d;background:#10151c}.brand{color:#f0b84b;font-weight:900;letter-spacing:.15em}.online{color:#69d697;font-size:11px}.main{min-height:0;display:grid;grid-template-columns:1fr 280px}.story{min-width:0;min-height:0;display:flex;flex-direction:column;background:radial-gradient(circle at 50% 0,#18232b22,transparent 45%),#0b0f15}.bar{padding:10px 18px;border-bottom:1px solid #29313d;color:#f0b84b;font-size:11px;font-weight:800;letter-spacing:.15em}.log{overflow:auto;padding:22px clamp(14px,4vw,55px)}.entry{max-width:850px;margin:0 auto 20px;padding-left:14px;border-left:2px solid #f0b84b}.entry.p{border-color:#52d6e8}.entry.s{border-color:#69d697}.label{font-size:9px;color:#8e98a8;font-weight:900;letter-spacing:.15em;text-transform:uppercase;margin-bottom:5px}.text{line-height:1.7}.sheet{padding:16px;border-left:1px solid #29313d;background:#11161d;overflow:auto}.name{font:25px Georgia;color:#fff}.class{color:#52d6e8;font-size:12px;margin:3px 0 15px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{padding:8px;text-align:center;background:#19212b;border:1px solid #29313d;border-radius:7px}.stat b{display:block;color:#fff;font-size:16px}.stat small{color:#8e98a8;font-size:8px}.hp{margin:12px 0;padding:10px;border:1px solid #29313d;border-radius:8px}.hphead{display:flex;justify-content:space-between;font-size:10px;color:#9da7b6;margin-bottom:6px}.track{height:8px;background:#292d35;border-radius:9px;overflow:hidden}.fill{height:100%;background:#df6262;transition:.3s}.gold{padding:9px;border:1px solid #6c5226;border-radius:7px;color:#f0b84b;margin-bottom:15px}.section{font-size:9px;color:#8e98a8;letter-spacing:.15em;font-weight:900;margin:13px 0 7px}.item{padding:7px;background:#171d25;border:1px solid #29313d;border-radius:6px;margin:4px 0;font-size:11px}.actions{padding:8px;display:grid;grid-template-columns:auto 1fr;gap:8px;border-top:1px solid #29313d;background:#0d1117}.quick{display:flex;gap:5px;flex-wrap:wrap}.quick button,.submit,.dice{border:1px solid #354151;background:#171e27;color:#dce2e9;border-radius:7px;padding:8px 10px;font-size:11px}.quick button:hover,.dice:hover{border-color:#f0b84b;color:#f0b84b}.input{display:flex;gap:6px}.input input{min-width:0;width:100%;background:#11161d;color:#fff;border:1px solid #354151;border-radius:7px;padding:9px;outline:0}.submit{background:#c88d2d;color:#160f05;font-weight:900}.dice{position:fixed;right:295px;bottom:104px;color:#52d6e8;z-index:5}.dicebox{display:none;position:fixed;right:295px;bottom:145px;padding:10px;background:#151c25;border:1px solid #354151;border-radius:8px;z-index:6}.dicebox.open{display:block}.dicebox button{margin:2px;padding:6px;background:#1c2530;color:#fff;border:1px solid #354151;border-radius:5px}.modal{position:fixed;inset:0;background:#05070acc;display:grid;place-items:center;z-index:20;padding:20px}.card{width:min(500px,100%);padding:27px;border:1px solid #354151;border-radius:12px;background:#121820;box-shadow:0 25px 70px #000}.card h1{font:45px Georgia;color:#f0b84b;margin:4px 0}.card p{color:#9da7b6;line-height:1.6}.card label{display:block;font-size:10px;color:#9da7b6;margin:10px 0 5px}.card input,.card select{width:100%;padding:11px;background:#0b1016;color:#fff;border:1px solid #354151;border-radius:7px}.begin{width:100%;margin-top:16px;padding:12px;background:#d29a39;border:0;border-radius:7px;font-weight:900}@media(max-width:750px){.main{grid-template-columns:1fr}.sheet{display:none}.actions{grid-template-columns:1fr}.quick{overflow:auto;flex-wrap:nowrap}.quick button{white-space:nowrap}.dice{right:8px;bottom:130px}.dicebox{right:8px;bottom:170px}}
</style>
</head>
<body>
<div class="app">
<header class="top"><div class="brand">✦ EMBERFALL</div><div class="online">● DM ONLINE</div></header>
<main class="main"><section class="story"><div class="bar">ADVENTURE LOG</div><div class="log" id="log"></div></section>
<aside class="sheet"><div class="name" id="name">Adventurer</div><div class="class" id="cls">—</div><div class="stats"><div class="stat"><small>LEVEL</small><b id="lvl">1</b></div><div class="stat"><small>AC</small><b id="ac">14</b></div><div class="stat"><small>XP</small><b id="xp">0</b></div></div><div class="hp"><div class="hphead"><span>HP</span><b id="hp">12/12</b></div><div class="track"><div class="fill" id="fill"></div></div></div><div class="gold">🪙 <b id="gold">10</b> gp</div><div class="section">INVENTORY</div><div id="inv"></div></aside></main>
<button class="dice" id="diceBtn">🎲 DICE</button><div class="dicebox" id="diceBox"><b>ROLL</b><br><button onclick="manual(4)">d4</button><button onclick="manual(6)">d6</button><button onclick="manual(8)">d8</button><button onclick="manual(10)">d10</button><button onclick="manual(12)">d12</button><button onclick="manual(20)">d20</button><div id="mr"></div></div>
<footer class="actions"><div class="quick"><button onclick="act('attack')">⚔️ Attack</button><button onclick="act('investigate')">🔍 Investigate</button><button onclick="act('flee')">🏃 Flee</button><button onclick="act('talk')">💬 Talk</button><button onclick="act('rest')">🔥 Rest</button><button onclick="act('inventory')">🎒 Inventory</button></div><div class="input"><input id="input" placeholder="Type your custom action..."><button class="submit" onclick="submit()">SUBMIT</button></div></footer></div>
<div class="modal" id="modal"><div class="card"><div style="color:#52d6e8;font-size:10px;letter-spacing:.2em;font-weight:900">DUNGEON MASTER</div><h1>Emberfall</h1><p>Your choices shape the adventure. Clever, absurd, heroic, or foolish actions are all valid.</p><label>CHARACTER NAME</label><input id="charName" placeholder="Enter your name"><label>CLASS</label><select id="charClass"><option>Fighter</option><option>Rogue</option><option>Wizard</option><option>Cleric</option><option>Ranger</option><option>Bard</option><option>Barbarian</option><option>Paladin</option></select><button class="begin" onclick="begin()">BEGIN ADVENTURE</button></div></div>
<script>
const S={name:"Adventurer",cls:"Fighter",lvl:1,hp:12,max:12,ac:14,gold:10,xp:0,inv:["Longsword","Adventurer's Pack","Healing Potion"],scene:"The Gilded Stag",combat:null,key:false,door:false,spider:false,chest:false,turn:0};
const $=x=>document.getElementById(x),log=$("log"),r=n=>Math.floor(Math.random()*n)+1;
function add(t,l,x){let e=document.createElement("div");e.className="entry "+t;e.innerHTML=`<div class="label">${l}</div><div class="text">${x}</div>`;log.append(e);log.scrollTop=log.scrollHeight}
function dm(x){add("","DUNGEON MASTER",x.replace(/\n/g,"<br><br>"))}function sys(x){add("s","SYSTEM",x)}function you(x){add("p",S.name,x.replace(/</g,"&lt;"))}
function hud(){name.textContent=S.name;cls.textContent=S.cls;lvl.textContent=S.lvl;ac.textContent=S.ac;xp.textContent=S.xp;hp.textContent=`${S.hp}/${S.max}`;gold.textContent=S.gold;fill.style.width=Math.max(0,S.hp/S.max*100)+"%";inv.innerHTML=S.inv.map(x=>`<div class=item>${x}</div>`).join("")}
function rollcheck(label,dc,mod=2){let a=r(20),total=a+mod,ok=a===20||total>=dc;add("s","DICE",`[${label}] Rolled ${a} + ${mod} = <b>${total}</b> vs DC ${dc}: <b>${ok?"SUCCESS":"FAILURE"}</b>`);return ok}
function begin(){S.name=($("charName").value||"Adventurer").slice(0,28);S.cls=$("charClass").value;S.max=S.hp=S.cls==="Barbarian"?16:12;S.ac=S.cls==="Fighter"||S.cls==="Paladin"?16:14;hud();$("modal").style.display="none";dm(`Rain lashes the windows of <b>The Gilded Stag</b>. Every candle suddenly bends toward a hooded stranger.<br><br>They place a tarnished silver key on your table.<br><br>"Under the old chapel. Midnight. Whatever you hear down there, <i>don't answer it.</i>"<br><br>Then they whisper your name.`)}
function damage(n,src){S.hp=Math.max(0,S.hp-n);hud();sys(`<b>${n} damage.</b> ${src} leaves you at ${S.hp}/${S.max} HP.`);if(!S.hp)dm("<b>You fall.</b> The adventure ends here. Refresh to try again.")}
function heal(n){S.hp=Math.min(S.max,S.hp+n);hud()}
function gain(x){S.xp+=x;if(S.xp>=S.lvl*100){S.lvl++;S.max+=4;S.hp=S.max;S.ac++;sys("✨ <b>LEVEL UP!</b>");}hud()}
function additem(x){if(!S.inv.includes(x))S.inv.push(x);hud()}
function attack(){if(!S.combat)return dm("There is nothing here that currently requires stabbing.");let e=S.combat,a=r(20),tot=a+2;add("s","DICE",`[Attack] Rolled ${a} + 2 = <b>${tot}</b> vs AC ${e.ac}: <b>${tot>=e.ac?"HIT":"MISS"}</b>`);if(tot>=e.ac){let d=r(8)+2;e.hp-=d;dm(`Your attack hits for <b>${d} damage</b>.`);if(e.hp<=0){dm("The Grave-Spider collapses. Something glitters beneath it.");S.combat=null;S.spider=true;gain(40);S.gold+=7;additem("Black Gem");hud();return}}else dm("Your attack misses.");enemy()}
function enemy(){if(!S.combat)return;let e=S.combat,a=r(20),tot=a+4;if(tot>=S.ac){let d=r(6)+1;damage(d,e.name)}else dm("The creature's attack misses.")}
function investigate(){if(S.scene==="The Gilded Stag"){if(rollcheck("Investigation",12)){dm("You find a crude sketch of the old chapel with an X beneath the altar.");additem("Chapel Sketch")}else dm("You discover only spilled ale, smoke, and a suspicious chicken.");}else if(S.scene==="Old Chapel"){if(rollcheck("Investigation",13)){dm("Behind the altar is a silver keyhole.");S.key=true;S.door=true;S.scene="Beneath the Chapel";dm("The mechanism opens. A staircase descends impossibly far.");startSpider()}else dm("Dust and broken stone reveal nothing.");}}
function startSpider(){S.combat={name:"Grave-Spider",hp:14,ac:13};dm("Eight pale eyes open in the darkness. A horse-sized spider wrapped in grave-cloth blocks the stairs.")}
function talk(){if(S.combat){if(rollcheck("Persuasion",15)){S.combat.hp-=3;dm("Your bizarre negotiation actually works. The creature loses 3 HP.");if(S.combat.hp<=0){S.spider=true;S.combat=null;gain(40)}}else enemy();return}dm(S.scene==="The Gilded Stag"?"The stranger smiles. \"Questions are expensive.\"":"Your voice echoes. Something beneath the stone whispers your name.")}
function flee(){if(!S.combat)return dm("There is nothing to flee from.");if(rollcheck("Escape",12)){S.combat=null;dm("You escape into the darkness.");}else enemy()}
function rest(){if(S.combat)return dm("You cannot rest while something is trying to kill you.");let n=Math.min(4,S.max-S.hp);heal(n);dm(n?`You catch your breath and recover <b>${n} HP</b>.`:"You are already at full health.")}
function inv(){dm("<b>Inventory:</b><br>"+(S.inv.join("<br>")||"Empty"))}
function travel(){if(S.scene==="The Gilded Stag"){S.scene="Old Chapel";dm("You follow the rain to the abandoned chapel. The doors swing open by themselves. A bell rings three times.");hud()}else if(S.scene==="Old Chapel"){if(!S.door&&!S.key){dm("The altar conceals a mechanism. You need a key.");return}S.scene="Beneath the Chapel";dm("You descend beneath the chapel. Your torch turns blue. Something skitters ahead.");startSpider();hud()}else if(S.scene==="Beneath the Chapel"&&S.spider&&!S.chest){S.chest=true;dm("A black iron chest waits ahead. It has no lock. It has a mouth.");}}
function custom(x){let l=x.toLowerCase();you(x);S.turn++;if(S.combat){if(/attack|hit|stab|strike|fight|kill|smash|shoot/.test(l))return attack();if(/flee|run|escape/.test(l))return flee();if(/talk|speak|persuade/.test(l))return talk();if(/potion|heal|drink/.test(l)&&S.inv.includes("Healing Potion")){S.inv=S.inv.filter(x=>x!=="Healing Potion");heal(r(8)+2);return}dm("You attempt an improvised manoeuvre.");return rollcheck("Improvised Action",14)?dm("Against all reasonable expectations, it works."):enemy()}if(/chapel|church|temple|outside|leave/.test(l))return travel();if(/down|basement|stairs|underground|below/.test(l))return travel();if(/investigate|search|inspect|examine|look|listen/.test(l))return investigate();if(/talk|speak|ask|question/.test(l))return talk();if(/rest|sleep|camp/.test(l))return rest();if(/inventory|bag|items/.test(l))return inv();if(/attack|fight|hit/.test(l))return attack();if(/flee|run|escape/.test(l))return flee();if(/dance|sing|lick|eat|steal|flirt|climb|throw|burn|break|pray|gamble/.test(l)){return rollcheck("Improvised Action",12)?dm("It is ridiculous. It is also successful.") :dm("It seemed like a good idea at the time.")}dm("The Dungeon Master considers your action. The world reacts in a way you did not entirely expect.");}
function act(a){if(a==="attack")attack();if(a==="investigate")investigate();if(a==="flee")flee();if(a==="talk")talk();if(a==="rest")rest();if(a==="inventory")inv()}
function submit(){let x=$("input").value.trim();if(x){$("input").value="";custom(x)}}$("input").addEventListener("keydown",e=>{if(e.key==="Enter")submit()});$("diceBtn").onclick=()=>$("diceBox").classList.toggle("open");function manual(n){let x=r(n);$("mr").innerHTML=`<b>d${n}: ${x}</b>`;add("s","DICE",`Manual roll: d${n} → <b>${x}</b>`)}hud();
</script>
</body>
</html>
